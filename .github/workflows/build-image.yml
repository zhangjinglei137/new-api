name: Build Docker Image

# 推送到 main 时(含 sync-upstream 合并产生的提交)或手动触发时,
# 在原生 runner 上分别构建 amd64(ubuntu-latest)与 arm64(ubuntu-24.04-arm),
# 推送固定中间 tag(edge-<arch>),merge 阶段统一计算日期,
# 合并为 multi-arch 的 latest 与日期 tag 到 thntime/new-api。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write VERSION
        run: |
          echo "main-$(date -u +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION
          echo "Publishing version: $(cat VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            thntime/new-api:edge-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Create multi-arch manifests
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifests
        run: |
          DATE=$(date -u +%Y%m%d-%H%M)
          docker buildx imagetools create \
            -t thntime/new-api:${DATE} \
            thntime/new-api:edge-amd64 \
            thntime/new-api:edge-arm64
          docker buildx imagetools create \
            -t thntime/new-api:latest \
            thntime/new-api:edge-amd64 \
            thntime/new-api:edge-arm64
