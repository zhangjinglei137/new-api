name: Build Docker Image

# 推送到 main 时(含 sync-upstream 合并产生的提交)或手动触发时,
# 在原生 runner 上分别构建 amd64(ubuntu-latest)与 arm64(ubuntu-24.04-arm),
# 推送固定中间 tag(edge-<arch>),merge 阶段统一计算日期,
# 合并为 multi-arch 的 latest 与日期 tag 到 thntime/new-api。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write VERSION
        run: |
          # Version = upstream latest tag + build timestamp, e.g. v1.0.0-rc.24-20260817-1504.
          # Falls back to v0.0.0 when the upstream GitHub API is unreachable.
          UPSTREAM_TAG="$(curl -fsSL --max-time 30 https://api.github.com/repos/Calcium-Ion/new-api/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)"
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG="v0.0.0"
          fi
          echo "${UPSTREAM_TAG}-$(node -e "const{execSync}=require('child_process');const t=+execSync('git show -s --format=%ct HEAD');console.log(new Date((t+28800)*1000).toISOString().replace(/[-T:]/g,'').slice(0,12))")" > VERSION
          echo "Publishing version: $(cat VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            thntime/new-api:edge-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Create multi-arch manifests
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifests
        run: |
          DATE=$(node -e "const{execSync}=require('child_process');const t=+execSync('git show -s --format=%ct HEAD');console.log(new Date((t+28800)*1000).toISOString().replace(/[-T:]/g,'').slice(0,12))")
          docker buildx imagetools create \
            -t thntime/new-api:${DATE} \
            thntime/new-api:edge-amd64 \
            thntime/new-api:edge-arm64
          docker buildx imagetools create \
            -t thntime/new-api:latest \
            thntime/new-api:edge-amd64 \
            thntime/new-api:edge-arm64
