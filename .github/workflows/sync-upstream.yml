name: Sync Upstream

# 每天 UTC 00:00 自动把 QuantumNous/new-api 的 main 合并进本仓库 main。
# 策略（本地优先 + 半自动）：
#   - 默认三方 merge：追加/不重叠改动自动合并；rerere 自动重放已人工解决的冲突
#   - 冲突无法自动解决时不兜底取本地侧（-X ours 会整文件丢弃上游新增符号导致
#     vet 编译失败），而是中止 merge 并创建/更新 issue 等待人工处理
#   - go vet 双模块验证关卡：合并结果必须通过 vet 才 push，防止上游必填符号缺失
#   - rerere seed 以 .github/rerere-cache/ 为唯一事实源（已入库，每次从仓库恢复；
#     不使用 actions/cache，避免旧缓存覆盖新种子）。人工解决冲突后需手动把
#     .git/rr-cache 新记录回填到该目录并提交（CI 上游已含 HEAD 时短路，无法自动收录）。
# 冲突自动解决后 push（触发 build-image.yml 重建镜像）；上游已包含在 HEAD 则短路不 push。
# 失败兜底：自动创建或更新带 sync-upstream label 的 issue 通知，不硬失败、不推坏代码。

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git rerere
        run: |
          git config rerere.enabled true
          git config rerere.autoupdate true

      - name: Restore rerere seed from repo
        run: |
          if [ -d .github/rerere-cache ]; then
            mkdir -p .git/rr-cache
            cp -r .github/rerere-cache/* .git/rr-cache/ 2>/dev/null || true
            echo "Restored rerere seed from repo"
          else
            echo "No rerere seed in repo"
          fi

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main

      - name: Check if upstream already merged
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already contained in HEAD, nothing to do"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into main (three-way + rerere)
        id: merge
        if: steps.check.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "### Upstream commits being merged" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git log --oneline HEAD..upstream/main >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # 默认三方 merge（rerere 命中优先重放已人工解决的方案）。
          # 冲突无法自动解决时中止并等待人工，绝不 -X ours 兜底：
          # 整文件取本地侧会静默丢弃上游新增符号，合并结果必然破坏编译。
          if git merge --no-edit upstream/main >/tmp/merge.log 2>&1; then
            echo "merge=success" >> "$GITHUB_OUTPUT"
          else
            echo "merge=conflicted" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicted-files.txt 2>/dev/null || true
            echo "### Merge conflicts (need manual resolution)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/conflicted-files.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "unknown" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git merge --abort 2>/dev/null || true
            # 必须非零退出：否则 run 显示 success，failure() 兜底（issue 通知）永不触发
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # main.go 有 //go:embed web/dist，runner checkout 后该目录不存在，
          # 必须先建占位文件否则 go vet/build 报 "pattern web/dist: no matching files found"。
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Verify build (fail-safe gate)
        id: verify
        if: steps.merge.outputs.merge == 'success'
        run: |
          set +e
          GOWORK=off go vet ./... > /tmp/vet-root.log 2>&1
          VET_ROOT=$?
          (cd relaykit && GOWORK=off go vet ./... > /tmp/vet-relaykit.log 2>&1)
          VET_RELAYKIT=$?
          set -e
          if [ $VET_ROOT -ne 0 ] || [ $VET_RELAYKIT -ne 0 ]; then
            echo "verify=failed" >> "$GITHUB_OUTPUT"
            echo "### VET FAILURE (upstream field lost?)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/vet-root.log >> "$GITHUB_STEP_SUMMARY"
            echo '--- relaykit ---' >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/vet-relaykit.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # merge 已成功提交（无 in-progress merge），这里只需丢弃未推送的合并
            # 结果即可；冲突文件列表在 merge=success 时不存在，issue 会附 vet 日志。
            git reset --hard origin/main 2>/dev/null || true
            # 必须非零退出：否则 run 显示 success，failure() 兜底（issue 通知）永不触发
            exit 1
          else
            echo "verify=passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Update rerere seed into merge commit
        if: steps.merge.outputs.merge == 'success' && steps.verify.outputs.verify == 'passed'
        run: |
          rm -rf .github/rerere-cache
          mkdir -p .github/rerere-cache
          cp -r .git/rr-cache/* .github/rerere-cache/ 2>/dev/null || true
          git add .github/rerere-cache
          git commit --amend --no-edit 2>/dev/null || echo "no rr-cache to amend"

      - name: Push merge
        if: steps.check.outputs.skipped == 'false' && steps.verify.outputs.verify == 'passed'
        run: git push origin main

      - name: Create or update issue on failure
        if: failure() && steps.check.outputs.skipped == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const conflicted = fs.existsSync('/tmp/conflicted-files.txt')
              ? fs.readFileSync('/tmp/conflicted-files.txt', 'utf8')
              : 'see run logs';
            const vetLog = (fs.existsSync('/tmp/vet-root.log') ? fs.readFileSync('/tmp/vet-root.log', 'utf8') : '')
              + (fs.existsSync('/tmp/vet-relaykit.log') ? '\n--- relaykit ---\n' + fs.readFileSync('/tmp/vet-relaykit.log', 'utf8') : '');
            const commits = execSync('git log --oneline HEAD..upstream/main 2>/dev/null || echo unknown').toString();
            const body = `每日上游同步无法自动解决冲突。\n\n**上游提交：**\n\`\`\`\n${commits}\`\`\`\n\n**冲突文件：**\n\`\`\`\n${conflicted}\`\`\`\n\n**vet 日志（合并成功但编译失败时）：**\n\`\`\`\n${vetLog.slice(-3000) || '(none)'}\`\`\`\n\n**处理步骤：**\n1. 本地 \`git fetch upstream && git merge --no-edit upstream/main\`，解决冲突并保证 \`GOWORK=off go vet ./...\`（含 relaykit）通过。\n2. 提交合并结果，并**手动回填 rerere 种子**（CI 无法自动收录人工解决方案）：\n   \`\`\`bash\n   cp -r .git/rr-cache/* .github/rerere-cache/ 2>/dev/null || true\n   git add .github/rerere-cache\n   git commit\n   \`\`\`\n3. push 后重跑本 workflow。\n4. 若同一冲突反复失败（旧 seed 已过期），删除 \`.github/rerere-cache/<hash>/\` 中对应的过期 postimage 目录后重试。`;
            // 复用已存在的未关闭 sync-upstream issue，避免每次失败都堆积新 issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-upstream',
            });
            const found = existing.data.find((i) => i.labels.some((l) => l.name === 'sync-upstream'));
            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body: body + `\n\n---\n更新于 ${new Date().toISOString()}：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Sync upstream 失败 - 需人工处理',
                body,
                labels: ['sync-upstream', 'auto-created'],
              });
            }
